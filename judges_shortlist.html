<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d22;--muted:#667085;--line:#e6e8ec;--accent:#1f4ed8}
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}

  header h1{margin:0 0 6px;font-size:22px} header p{margin:0;opacity:.9;font-size:13.5px}
  .toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line)}
  #q{width:100%;padding:11px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:#fff}

<script>
const DATA=[{"rank": 1, "num": 163, "forum": "3Ju0RzyUqU", "title": "FlowPDE: Understanding and Justifying Flow Matching in PDE Solving", "abstract": "Neural PDE solvers have recently begun to incorporate generative modeling. However, applying generative models to PDE solving raises a fundamental question: the uniqueness of the solution of a well-posed PDE seems to conflict with the distributional nature of generative learning, and raises concerns about whether such models may introduce non-physical or hallucinated solutions. In this work, we provide a theoretical justification for using Flow Matching in neural PDE solving. We show that, under full problem information, the target conditional distribution collapses to a one-point distribution at the exact solution, and that classical iterative solvers can be viewed as deterministic energy-descending flow trajectories. Based on this insight, we propose FlowPDE, a general framework that equips existing transformer-based neural operators with a conditional flow matching model through AdaLN-style injection of PDE conditions. We provide a unified formulation for both fully observed and partially observed PDE problems. Experiments on diverse PDE benchmarks with complex geometries demonstrate that FlowPDE consistently improves over strong deterministic baselines across both full and partial observation regimes.", "authors": [{"name": "Tianxiao Li", "aff": "Tsinghua University"}, {"name": "Tianyu Huang", "aff": "Tsinghua University"}, {"name": "Hang Zhou", "aff": "Tsinghua University, Tsinghua University"}, {"name": "Yuezhou Ma", "aff": "Tsinghua University, Tsinghua University"}, {"name": "Minghao Guo", "aff": "Massachusetts Institute of Technology"}, {"name": "Haixu Wu", "aff": "Massachusetts Institute of Technology"}, {"name": "Chuang Gan", "aff": "University of Massachusetts at Amherst"}, {"name": "Mingsheng Long", "aff": ""}, {"name": "Wojciech Matusik", "aff": "Massachusetts Institute of Technology"}], "last_author": "Wojciech Matusik", "last_aff": "Massachusetts Institute of Technology", "last_pos": "Full Professor"}, {"rank": 2, "num": 3, "forum": "NjCAj1hZGY", "title": "StarEmbed: Benchmarking Time Series Foundation Models on Astronomical Observations of Variable Stars", "abstract": "Time series foundation models (TSFMs) are increasingly adopted as general-purpose time series learners. Although their training corpora are vast, they exclude peta-scale astronomical time series that exhibit unique challenges (e.g., irregular sampling, multiple variates, and heteroskedasticity) and exist in immense quantities. We introduce $\\texttt{StarEmbed}$, the first public benchmark for stellar time series observations (``light curves'') on three downstream tasks: unsupervised clustering, supervised classification, and out-of-distribution (OOD) source detection. $\\texttt{StarEmbed}$ integrates a catalog of expert-vetted light curves, totaling $\\sim$40,000 labeled examples across seven astrophysical classes. We evaluate the zero-shot capabilities of three families of TSFMs ($\\texttt{Moirai}$, $\\texttt{Chronos}$, and $\\texttt{Time-MoE}$) and a domain-specific transformer ($\\texttt{Astromer}$). Our results demonstrate that the $\\texttt{Chronos}$ family, despite being pre-trained on regularly sampled data, outperforms domain-specific baselines and yields state-of-the-art performance in clustering and OOD source detection. While they do not yet strictly surpass hand-crafted features in classification, TSFM models like the Chronos models demonstrate excellent generalization performance, marking a promising step toward universal foundation models in astronomy.", "authors": [{"name": "Weijian Li", "aff": "Northwestern University"}, {"name": "Hong-Yu Chen", "aff": "Northwestern University"}, {"name": "Nabeel Rehemtulla", "aff": "Northwestern University"}, {"name": "Ved G. Shah", "aff": "Northwestern University"}, {"name": "Dongho Kim", "aff": "Northwestern University"}, {"name": "Dennis Wu", "aff": ""}, {"name": "Qinjie Lin", "aff": "Northwestern University, Northwestern University"}, {"name": "Adam A. Miller", "aff": ""}, {"name": "Han Liu", "aff": "Northwestern University"}], "last_author": "Han Liu", "last_aff": "Northwestern University", "last_pos": "Full Professor"}, {"rank": 3, "num": 8, "forum": "4rgtkoCNnA", "title": "Generative Priors Accelerate Inverse Design for Regularized, High Performance Integrated Photonics", "abstract": "Adjoint-based inverse design has revolutionized integrated photonics, yet existing workflows remain computationally inefficient due to a heavy dependence on high-quality initialization. We propose that archives of past optimization traces, typically discarded, should be repurposed as $\\textbf{reusable scientific memory}$. We introduce a physics-compatible generative framework that learns a conditional prior over optimized device layouts to seed downstream adjoint refinement. Our model, a conditional Variational Autoencoder (cVAE), is trained on archived designs and incorporates a differentiable filter-project operator to enforce fabrication-feasible geometries. At inference, the model samples candidate templates which are ranked via a reduced-cost electromagnetic screen before final adjoint optimization. On arbitrary-ratio silicon power splitters with a matched 60-step refinement budget, our cVAE-seeded approach reduces median insertion loss by $3.2\\times$ (to $0.127$ dB) with no floor objective function and from $5.07$ dB to $1.94$ dB in the with-floor setting. Crucially, the learned prior also improves both convergence speed by 50\\% and the geometry-performance trade-off. Here, we demonstrate $\\textbf{amortization of historical optimization}$ into reusable priors transforms restart-heavy global search into efficient, template-guided refinement.", "authors": [{"name": "Taehan Kim", "aff": "Memorial Sloan Kettering Cancer Centre"}, {"name": "Junho Park", "aff": "University of Michigan - Ann Arbor"}, {"name": "Mohammad Ali", "aff": "University of Michigan - Ann Arbor"}, {"name": "SooHyuk Cho", "aff": "Princeton University"}, {"name": "Di Liang", "aff": "University of Michigan - Ann Arbor"}], "last_author": "Di Liang", "last_aff": "University of Michigan - Ann Arbor", "last_pos": "Full Professor"}, {"rank": 4, "num": 184, "forum": "r2NSBJ4ip7", "title": "Geometry, Not Energy Surface, Drives the Neutral MLIP–DFT Gap in Atomistic Interaction Surrogates", "abstract": "Pretrained universal machine-learning interatomic potentials (MLIPs)  are now positioned as high-fidelity surrogate simulators for electronic-structure physics, widely expected to replace explicit quantum chemistry where they cover the chemistry. We show that on non-covalent binding, this expectation is mostly right, but mostly for the wrong reason. We audit the FAIRChem UMA omol head on 5,565 probe-target dimers from 18 benchmarks across nine fidelity arms, without any task-specific fine-tuning. Three findings emerge. First, the neutral MLIP-DFT gap is geometric rather than a learned-surface error: an explicit $\\omega$B97M-V single point at the MLIP geometry leaves mean absolute error (MAE) at 1.64 kcal/mol, while reoptimizing the geometry drops it to 1.44, and MACE-omol and ORB-omol reach the same DFT-SP parity on neutral chemistry. Second, charged systems behave as a qualitatively different regime: MAE jumps to 13.83-27.21 kcal/mol with Spearman $\\rho\\approx 0$, a DFT single point does not recover it, only DFT geometry reoptimization does; and the failure persists across all three backbones. Third, the residual errors are structured: signed biases cluster by chemistry family, so a 10\\% per-benchmark calibration offset improves neutral MAE to 1.32 kcal/mol at zero additional cost, and a chemistry-aware replay selector ChemUCB-8 reaches 1.06 kcal/mol at 52\\% of the CREST xTB+DFT baseline cost. The audit is delivered through RAPIDS, a training-free inference-time scaffold exposed via a Model Context Protocol (MCP) interface and illustrated on a per- and polyfluoroalkyl substance (PFAS) sensing case study.", "authors": [{"name": "Rui Ding", "aff": "University of Chicago"}, {"name": "Zixin Ding", "aff": "Meta"}, {"name": "Rodrigo P. Ferreira", "aff": "University of Chicago"}, {"name": "Yuxin Chen", "aff": "University of Chicago"}, {"name": "Junhong Chen", "aff": "University of Chicago"}], "last_author": "Junhong Chen", "last_aff": "University of Chicago", "last_pos": "Full Professor"}, {"rank": 5, "num": 131, "forum": "7xf2daF2vi", "title": "Quality-Weighted Determinantal Point Processes for Sample Efficient DFT Surrogate Models", "abstract": "Density functional theory (DFT) is widely used to compute electronic structure and materials properties, but it is expensive to run. When compute is limited, practitioners must choose which candidate systems to evaluate. We study this selection problem on JARVIS-DFT, a large standardized dataset of DFT labeled crystal structures and a realistic testbed for training machine learning models to predict expensive DFT computed properties. We propose quality-weighted determinantal point process (QW-DPP), a label-free coreset selection method for training DFT surrogate models. QW-DPP selects candidates that are both diverse through an RBF kernel and representative through a density-based quality score from unlabeled structural fingerprints. On JARVIS-DFT, QW-DPP reduces test MAE compared with random sampling by up to 8.9% at a 1% labeling budget across formation energy and bulk modulus. This improvement holds across Ridge, Bayesian Ridge, and Gradient Boosting. We find that QW-DPP is most useful at very small budgets because it improves worst case coverage of feature space.", "authors": [{"name": "Shirley X. Yu", "aff": "Princeton University"}, {"name": "Adji Bousso Dieng", "aff": "Princeton University"}], "last_author": "Adji Bousso Dieng", "last_aff": "Princeton University", "last_pos": "Assistant Professor"}, {"rank": 6, "num": 165, "forum": "ZMMiVPNSrN", "title": "Training Neural PDE Solvers with Partial Observations", "abstract": "In many scientific settings, acquiring complete observations of PDE coefficients and solutions can be expensive, hazardous, or impossible. Recent diffusion-based methods can reconstruct fields given partial observations, but require complete observations for training. We introduce Ambient Physics, a framework for learning the joint distribution of coefficient-solution pairs directly from partial observations, without requiring a single complete observation. The key idea is to randomly mask a subset of already-observed measurements and supervise on them, so the model cannot distinguish \"truly unobserved\" from \"artificially unobserved\", and must produce plausible predictions everywhere. Ambient Physics achieves state-of-the-art reconstruction performance. Compared with prior diffusion-based methods, it achieves a 62.51\\% reduction in average overall error while using 125$\\times$ fewer function evaluations. We also identify a \"one-point transition'': masking a single already-observed point enables learning from partial observations across architectures and measurement patterns. Ambient Physics thus enables scientific progress in settings where complete observations are unavailable.", "authors": [{"name": "Harris Abdul Majid", "aff": "The University of Edinburgh"}, {"name": "Giannis Daras", "aff": "Massachusetts Institute of Technology"}, {"name": "Francesco Tudisco", "aff": "University of Edinburgh, University of Edinburgh"}, {"name": "Steven McDonagh", "aff": "University of Edinburgh"}], "last_author": "Steven McDonagh", "last_aff": "University of Edinburgh", "last_pos": "Associate Professor"}, {"rank": 7, "num": 148, "forum": "VWWv1Npj2b", "title": "One More Time: Revisiting Neural Quantum States from a Reinforcement Learning Perspective", "abstract": "Neural quantum states (NQS) provides a flexible and scalable framework for approximating quantum many-body wavefunctions. Among NQS parameterizations, autoregressive models are especially attractive because they enable exact, independent sampling from the Born distribution, avoiding the autocorrelation and mixing issues of Markov chain methods. Yet their optimization remains comparatively underexplored: Adam is a scalable method but ignores function space geometry, while stochastic reconfiguration is principled but costly and numerically fragile in large models. To address this gap, we show that variational energy minimization can be viewed as an advantage policy-gradient problem over the Born distribution, motivating trust-region optimization for NQS training. We introduce \\emph{Proximal Wavefunction Optimization} (PWO), a trust-region algorithm that clips probability-ratio changes in the amplitude channel and wrapped phase increments in the phase channel. PWO avoids explicit matrix inversion, reuses samples across inner updates, and preserves the scalability of first-order optimization. Across Ising, Heisenberg, and frustrated $J_1-J_2$ spin chains, PWO improves stability and wall-clock convergence over Adam, minSR, and SPRING. Finally, we fine-tune a $1.5$B-parameter RWKV-7 model as a neural quantum state, demonstrating NQS optimization at a scale over three orders of magnitude beyond prior work.", "authors": [{"name": "Juan Agustin Duque", "aff": "Université de Montréal"}, {"name": "Sergio García-Heredia", "aff": "Leiden University"}, {"name": "Vinicius Hernandes", "aff": "Delft University of Technology"}, {"name": "Eliska Greplova", "aff": "Delft University of Technology"}, {"name": "Thomas Spriggs", "aff": "Delft University of Technology"}, {"name": "Aaron Courville", "aff": "University of Montreal"}, {"name": "Anna Dawid", "aff": "Leiden University, Leiden University"}], "last_author": "Anna Dawid", "last_aff": "Leiden University, Leiden University", "last_pos": "Assistant Professor"}, {"rank": 8, "num": 18, "forum": "5tlXAcM9gv", "title": "Data-Driven Transport Geometry for Rare Events in Metastable Systems", "abstract": "Rare-event transitions in metastable systems are expensive to sample because direct simulation spends most of its time in long-lived basins, and only rarely undergo transitions. We study whether Implicit Manifold-valued Diffusions (IMDs), learned directly from trajectory point clouds, can act as data-driven surrogates of the transport geometry underlying such transitions. Our central hypothesis is that when the training cloud is drawn from a biased dynamical ensemble (such as successful reactive trajectories or steady-state Langevin samples) the learned operator inherits both the support of the data and its sampling bias. On a curved transition tube and on the Müller-Brown landscape, IMDs trained on reactive data recover the dominant transition corridor and yield substantially higher short-horizon crossing probabilities than unbiased reference simulations, without access to the ambient drift. When trained on steady-state data, IMDs reproduce the coarse basin occupancy structure of the reference process. These results support IMDs as lightweight surrogates for transport geometry in metastable systems, while clarifying that they approximate coarse transport structure rather than exact kinetics or invariant laws.", "authors": [{"name": "Victor Kawasaki-Borruat", "aff": "EPFL - EPF Lausanne"}, {"name": "Pierre Vandergheynst", "aff": "EPFL - EPF Lausanne"}], "last_author": "Pierre Vandergheynst", "last_aff": "EPFL - EPF Lausanne", "last_pos": "Full Professor"}, {"rank": 9, "num": 123, "forum": "x7tbgnfCbd", "title": "Learning to Trigger: Reinforcement Learning at Large Hadron Collider", "abstract": "High-throughput scientific facilities such as the Large Hadron Collider depend on real-time event filtering (\\textit{triggering}) under tight constraints on bandwidth, latency, and storage. In practice, trigger menus are largely static and hand-tuned and can become suboptimal as detector conditions, pileup, and background composition drift over time. We cast online threshold tuning as a sequential decision-making problem: a reinforcement learning agent ingests streaming summaries of recent rates and signal-sensitive features and updates trigger thresholds to maximize signal efficiency while tracking a target background rate within a tolerance band. We adapt Group-Filtered Policy Optimization (GFPO) to streaming control and introduce two variants (GFPO-F, GFPO-FR) that enforce background rate feasibility during training. On a benchmark that emulates realistic collider operation, we study two representative triggers: a total transverse energy ($H_{T}$) trigger sensitive to pileup variation, and an anomaly-detection (AD) \ntrigger based on reconstruction loss for rare or non-standard \nsignatures. On Monte Carlo streams, our agent increases the fraction of in-tolerance time intervals by 38\\% ($H_T$) and 30\\% (AD), with a cumulative gain of up to 5\\% in signal efficiency on those in-tolerance intervals. Transferring from simulation to \\emph{real} collision data (CMS Run 283408), the same agent, without fine-tuning, achieves a 40\\% ($H_T$) and 25\\% (AD) in-tolerance improvement over baselines, with an additional 1\\% signal-efficiency gain on both triggers. To our knowledge, this is the first demonstration of RL-based trigger control on real Large Hadron Collider collision data.", "authors": [{"name": "Zixin Ding", "aff": "Meta"}, {"name": "Shaghayegh Emami", "aff": "University of Michigan - Ann Arbor"}, {"name": "Giovanna Salvi", "aff": "University of Michigan - Ann Arbor"}, {"name": "Cecilia Tosciri", "aff": "University of Chicago"}, {"name": "Abhijith Gandrakota", "aff": "Fermi National Accelerator Laboratory (Fermilab)"}, {"name": "Ngadiuba Jennifer", "aff": "Fermi National Accelerator Laboratory (Fermilab)"}, {"name": "Nhan Tran", "aff": "Fermi National Accelerator Laboratory"}, {"name": "Christian Herwig", "aff": "University of Michigan - Ann Arbor"}, {"name": "David Miller", "aff": "University of Chicago"}, {"name": "Yuxin Chen", "aff": "University of Chicago"}], "last_author": "Yuxin Chen", "last_aff": "University of Chicago", "last_pos": "Assistant Professor"}, {"rank": 10, "num": 86, "forum": "YYolr0ezd7", "title": "Trading off Controllability and Realism in Generative Physics Emulators", "abstract": "Machine-learned emulators trained on numerical models' outputs inherit systematic biases relative to real-world observations. While adapting these emulators toward observations can enhance their realism, it often reduces their diversity from a carefully constructed ensemble of simulations. This creates a fundamental \\textit{controllability-realism tradeoff}, where gaining accuracy comes at the cost of losing the distinct identities of the underlying simulators. In this work, we formalize this tradeoff for conditional generative emulators and introduce \\textit{condition-to-condition guidance}. Our method is an inference-time approach that interpolates between simulator and observational conditional score functions controlled by a guidance scale $\\gamma$. We further provide a principled procedure for selecting an optimal $\\gamma ^\\star$. We evaluate our framework on a climate science use case and compare it with a classical bias correction method.", "authors": [{"name": "Francesco Immorlano", "aff": "University of California, Irvine"}, {"name": "Elijah Tavares", "aff": "University of California, Irvine"}, {"name": "Felix Draxler", "aff": "University of California, Irvine"}, {"name": "Juan Nathaniel", "aff": "Columbia University"}, {"name": "Violette Launeau", "aff": ""}, {"name": "Padhraic Smyth", "aff": "University of California, Irvine"}, {"name": "Pierre Gentine", "aff": "Columbia University"}, {"name": "Stephan Mandt", "aff": ""}], "last_author": "Stephan Mandt", "last_aff": "University of California, Irvine", "last_pos": "Faculty"}];
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list=document.getElementById('list'),q=document.getElementById('q'),count=document.getElementById('count');
function authorsHTML(c){const n=c.authors.length;return c.authors.map((a,i)=>`<span class="${i===n-1?'last':''}">${esc(a.name)}</span>`).join(', ');}
function affsHTML(c){const seen=[];c.authors.forEach(a=>{if(a.aff&&!seen.includes(a.aff))seen.push(a.aff);});return esc(seen.join(' · '));}
function render(items){
  list.innerHTML=items.map(c=>`
   <div class="card"><div class="row">
     <div class="rank">${c.rank}</div>
     <div class="body">
       <span class="title">${esc(c.title)}</span>
       <div class="authors">${authorsHTML(c)}</div>
       <div class="affs">${affsHTML(c)} &nbsp;·&nbsp; senior: <b>${esc(c.last_author)}</b> — ${esc(c.last_pos)}, ${esc(c.last_aff)}</div>
       <div class="actions">
         <a class="btn pdf" href="https://openreview.net/pdf?id=${c.forum}" target="_blank" rel="noopener">📄 Open PDF</a>
         <button class="btn" onclick="const a=this.closest('.body').querySelector('.abs');const o=a.style.display==='block';a.style.display=o?'none':'block';this.textContent=o?'Show abstract ▾':'Hide abstract ▴';">Show abstract ▾</button>
       </div>
       <div class="abs">${esc(c.abstract)}</div>
     </div>
   </div></div>`).join('');
  count.textContent=`${items.length} of ${DATA.length} papers`;
}
function filter(){const t=q.value.trim().toLowerCase();if(!t){render(DATA);return;}
  render(DATA.filter(c=>(c.title+' '+c.abstract+' '+c.authors.map(a=>a.name+' '+a.aff).join(' ')).toLowerCase().includes(t)));}
q.addEventListener('input',filter);render(DATA);
</script></body></html>
